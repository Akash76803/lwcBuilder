<template><template lwc:if={shown}><article class={boxClass} style={style} onclick={select} ondragover={allow} ondrop={drop}>
 <template lwc:if={bindingError}><p class="binding-error">Sample binding: {bindingError}</p></template>
 <template lwc:if={isContainer}><header><strong>{label}</strong><template lwc:if={isAccordionSection}><button type="button" aria-expanded={expanded} onclick={toggleSection}>Expand / collapse</button></template><template lwc:if={isForm}><span>Create / Edit / Read</span></template><template lwc:if={isModal}><span>Modal container</span></template></header><template lwc:if={isTabs}><nav class="tabstrip"><template for:each={tabOptions} for:item="tab"><button key={tab.id} type="button" aria-pressed={tab.selected} data-id={tab.id} onclick={tabClick}>{tab.label}</button></template></nav></template><template lwc:if={isForm}><template lwc:if={hasPackBinding}><pre class="bound-json">{boundJson}</pre></template></template><template lwc:if={showChildren}><div class={childrenClass} style={childrenStyle}><template lwc:if={emptyContainer}><p class="empty-container">Drop compatible components here</p></template><template for:each={renderedChildren} for:item="child"><c-builder-node key={child.id} node={child} selected-id={selectedId} preview={preview} state={state}></c-builder-node></template></div></template></template>
 <template lwc:if={isBaseInput}><lightning-input label={label} type={inputType} value={value} checked={checked} placeholder={placeholder} required={required} disabled={disabled} read-only={readonly} min={inputMin} max={inputMax} step={inputStep} minlength={minLength} maxlength={maxLength} pattern={inputPattern} message-toggle-active={node.props.toggleActive} message-toggle-inactive={node.props.toggleInactive} message-when-value-missing={node.props.messageRequired} message-when-type-mismatch={node.props.messageType} message-when-bad-input={node.props.messageType} message-when-range-underflow={node.props.messageMin} message-when-range-overflow={node.props.messageMax} message-when-step-mismatch={node.props.messageStep} message-when-too-short={node.props.messageShort} message-when-too-long={node.props.messageLong} message-when-pattern-mismatch={node.props.messagePattern} onchange={inputChange} onblur={inputBlur}></lightning-input></template>
 <template lwc:if={isInput}><label>{label}<input type={inputType} value={value} checked={checked} placeholder={placeholder} required={required} disabled={disabled} readonly={readonly} onchange={previewChange} /></label></template>
 <template lwc:if={isCombo}><label>{label}<select disabled={disabled} required={required} onchange={previewChange}><option value="">Select…</option><template for:each={options} for:item="option"><option key={option.key} value={option.value} selected={option.selected}>{option.value}</option></template></select></label></template>
 <template lwc:if={isButton}><button class={buttonClass} disabled={disabled} onclick={action}>{label}</button></template>
 <template lwc:if={isSearch}><label>{label}<input placeholder="Search products by name, code or category…" onchange={previewChange}/></label></template>
 <template lwc:if={isSummary}><c-builder-summary node={node}></c-builder-summary></template><template lwc:if={isTable}><c-builder-table node={node} preview={preview} ontablechange={tableChange}></c-builder-table></template>
 <template lwc:if={isSelection}><c-builder-selection node={node} onselectionchange={selectionChange}></c-builder-selection></template>
 <template lwc:if={isTextarea}><label>{label}<textarea rows={rows} placeholder={placeholder} disabled={disabled} required={required} onchange={previewChange}>{value}</textarea></label></template>
 <template lwc:if={isChoiceGroup}><fieldset><legend>{label}</legend><template for:each={options} for:item="option"><label key={option.key} class="choice"><input type={choiceType} name={choiceName} value={option.value} checked={option.selected} disabled={disabled} data-choice="true" onchange={choiceChange}/>{option.value}</label></template></fieldset></template>
 <template lwc:if={isOptions}><label>{label}<select multiple={multiple} disabled={disabled} onchange={previewChange}><template for:each={options} for:item="option"><option key={option.key} value={option.value} selected={option.selected}>{option.value}</option></template></select></label></template>
 <template lwc:if={isMenu}><label>{label}<select disabled={disabled}><option>Actions…</option><template for:each={options} for:item="option"><option key={option.key}>{option.value}</option></template></select></label></template>
 <template lwc:if={isIconButton}><button disabled={disabled} onclick={action}><lightning-icon icon-name={iconName} size="x-small" alternative-text={label}></lightning-icon> {label}</button></template>
 <template lwc:if={isIcon}><lightning-icon icon-name={iconName} size="small" alternative-text={label}></lightning-icon> {label}</template>
 <template lwc:if={isOutput}><div class="placeholder"><strong>{label}</strong><p>{outputCaption}</p></div></template>
 <template lwc:if={isChild}><div class="placeholder"><strong>{label}</strong><p>Registered LWC placeholder</p><small>Live adapter connects in Phase 3</small></div></template>
 <template lwc:if={preview}></template><template lwc:else><small class="tag">{tag}</small></template>
 </article></template></template>
