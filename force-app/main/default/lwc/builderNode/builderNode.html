<template><template lwc:if={shown}><article class={boxClass} style={style} onclick={select} ondragover={allow} ondrop={drop}>
 <template lwc:if={bindingError}><p class="binding-error">Sample binding: {bindingError}</p></template>
 <template lwc:if={isContainer}><header><strong>{label}</strong><template lwc:if={isForm}><span>Create / Edit / Read</span></template><template lwc:if={isModal}><span>Modal container</span></template></header><template lwc:if={isTabs}><nav class="tabstrip">Details · Related · History</nav></template><template lwc:if={isForm}><template lwc:if={hasPackBinding}><pre class="bound-json">{boundJson}</pre></template></template><div class={childrenClass}><template for:each={node.children} for:item="child"><c-builder-node key={child.id} node={child} selected-id={selectedId} preview={preview} state={state}></c-builder-node></template></div></template>
 <template lwc:if={isInput}><label>{label}<input value={value} readonly={readonly} onchange={previewChange} /></label></template>
 <template lwc:if={isCombo}><label>{label}<select onchange={previewChange}><option>{value}</option><option>Mumbai Warehouse</option><option>Pune Warehouse</option></select></label></template>
 <template lwc:if={isButton}><button class="primary" onclick={action}>{label}</button></template>
 <template lwc:if={isSearch}><label>{label}<input placeholder="Search products by name, code or category…" onchange={previewChange}/></label></template>
 <template lwc:if={isTable}><template lwc:if={hasPackBinding}><header><strong>{label}</strong><span>Data Pack · sample output</span></header><template lwc:if={hasBoundTable}><template lwc:if={noBoundRows}><p>No sample records matched.</p></template><div class="scroll"><table><thead><tr><template for:each={boundColumns} for:item="col"><th key={col.key}>{col.label}</th></template></tr></thead><tbody><template for:each={boundRows} for:item="row"><tr key={row.key}><template for:each={row.cells} for:item="cell"><td key={cell.key}>{cell.value}</td></template></tr></template></tbody></table></div></template></template><template lwc:else><header><strong>{label}</strong><span>Sample data</span></header><div class="scroll"><table><thead><tr><th>Product</th><th>Qty</th><th>Unit Price ₹</th><th>Discount</th><th>Total ₹</th></tr></thead><tbody><tr><td>Laminated Panel</td><td>12</td><td>1,250</td><td>5%</td><td>14,250</td></tr><tr><td>Edge Band</td><td>20</td><td>180</td><td>0%</td><td>3,600</td></tr><tr><td>Adhesive</td><td>6</td><td>450</td><td>0%</td><td>2,700</td></tr></tbody></table></div><footer>Subtotal <strong>₹20,550</strong><button onclick={action}>Edit row</button></footer></template>
</template>
 <template lwc:if={isChild}><div class="placeholder"><strong>{label}</strong><p>Registered LWC placeholder</p><small>Live adapter connects in Phase 3</small></div></template>
 <template lwc:if={preview}></template><template lwc:else><small class="tag">{tag}</small></template>
 </article></template></template>
