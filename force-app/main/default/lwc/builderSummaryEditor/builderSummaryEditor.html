<template><h3>Summary source</h3><label>Runtime Data Pack from table<select data-key="sourceTableId" onchange={change}><option value="">Published pack (Bindings tab)</option><template for:each={sources} for:item="s"><option key={s.value} value={s.value} selected={s.selected}>{s.label}</option></template></select></label><label>Rows to summarize<select data-key="scope" onchange={change}><template for:each={scopes} for:item="s"><option key={s.value} value={s.value} selected={s.selected}>{s.value}</option></template></select></label><p>selected = cart selection; all = all current table rows. Runtime data is session-only.</p><label>Group by<select data-key="groupBy" onchange={change}><option value="">All items (one summary row)</option><template for:each={groups} for:item="f"><option key={f.path} value={f.path} selected={f.selected}>{f.label}</option></template></select></label><button type="button" onclick={add}>＋ Aggregate column</button><template for:each={metrics} for:item="m"><section key={m.id}><label>Label<input value={m.label} data-key="label" data-id={m.id} onchange={change}/></label><label>Source column<select data-key="path" data-id={m.id} onchange={change}><template for:each={m.fields} for:item="f"><option key={f.path} value={f.path} selected={f.selected}>{f.label}</option></template></select></label><label>Aggregate<select data-key="operation" data-id={m.id} onchange={change}><template for:each={m.operations} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.value}</option></template></select></label><button type="button" data-id={m.id} onclick={remove}>Remove metric</button></section></template><details><summary>Inspect current runtime Data Pack</summary><pre>{packJson}</pre></details><p role="alert">{error}</p></template>
