<template><label>Display<select data-field="mode" onchange={change}><template for:each={modes} for:item="m"><option key={m.value} value={m.value} selected={m.selected}>{m.label}</option></template></select></label><template lwc:if={legacy}><p>Existing legacy rules remain active until you choose a new visibility setting.</p></template><template lwc:if={conditional}><label>Match<select data-field="match" onchange={change}><template for:each={matches} for:item="m"><option key={m.value} value={m.value} selected={m.selected}>{m.label}</option></template></select></label><template for:each={rows} for:item="row"><div key={row.id} class="condition"><label>Source component<select data-id={row.id} data-field="sourceId" onchange={change}><option value="">Choose component</option><template for:each={row.options} for:item="source"><option key={source.id} value={source.id} selected={source.selected}>{source.label}</option></template></select></label><template lwc:if={row.missing}><p role="alert">Choose an existing source component.</p></template><label>Operator<select data-id={row.id} data-field="operator" onchange={change}><template for:each={row.operators} for:item="op"><option key={op.value} value={op.value} selected={op.selected}>{op.value}</option></template></select></label><template lwc:if={row.needsValue}><label>Value<input data-id={row.id} data-field="value" value={row.value} onchange={change}/></label></template><button data-id={row.id} onclick={remove}>Remove condition</button></div></template><button onclick={add}>＋ Add condition</button><p>Conditions run in Preview. Hidden containers hide their children.</p></template></template>
