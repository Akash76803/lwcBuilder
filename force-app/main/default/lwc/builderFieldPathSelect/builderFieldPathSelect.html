<template><div class="field-selector"><label>{label}<input class="search" type="search" placeholder="Search label or API name…" aria-label="Search field choices" value={search} onchange={searchChange}/><select aria-label={label} onchange={choose}><option value="" selected={selectedEmpty}>Choose field / no field</option><template for:each={options} for:item="option"><option key={option.value} value={option.value} selected={option.selected}>{option.label}</option></template></select></label><template lwc:if={loading}><small role="status">Loading readable org fields…</small></template><template lwc:if={error}><small class="error" role="alert">{error}</small></template><template lwc:if={missingContext}><small>Select the source object first.</small></template><template lwc:elseif={noFields}><small>No fields available. Select source fields in the schema picker.</small></template><details><summary>Advanced: manual API path</summary><label>API path<input value={value} onchange={manual} placeholder="Account.Owner.Name"/></label><small>Use the source relationship picker to add lookup paths to the dropdown. Manual paths need verification.</small></details><template lwc:if={manualError}><small class="error" role="alert">{manualError}</small></template></div></template>
