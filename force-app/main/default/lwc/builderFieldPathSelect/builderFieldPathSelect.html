<template><div class="field-selector"><label>{label}<input class="search" type="search" placeholder="Search label or API name…" aria-label="Search field choices" value={search} onchange={searchChange}/><select aria-label={label} onchange={choose}><option value="" selected={selectedEmpty}>Choose field / no field</option><template for:each={options} for:item="option"><option key={option.value} value={option.value} selected={option.selected}>{option.label}</option></template></select></label><button class="browse-button" onclick={open} disabled={disableBrowse}>Browse fields &amp; parent lookups →</button><template lwc:if={loading}><small role="status">Loading readable org fields…</small></template><template lwc:if={error}><small class="error" role="alert">{error}</small></template><template lwc:if={missingContext}><small>Select the source object first.</small></template><template lwc:elseif={noFields}><small>No fields selected. Browse fields and parent lookups to choose one.</small></template><details><summary>Advanced: manual API path</summary><label>API path<input value={value} onchange={manual} placeholder="Account.Owner.Name"/></label><small>Manual paths need verification. Use the browser to build lookup paths visually.</small></details><template lwc:if={manualError}><small class="error" role="alert">{manualError}</small></template></div>
<template lwc:if={expanded}><div class="backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-label="Select field and parent lookup path" onkeydown={modalKey}><header><div><span class="eyebrow">FIELD &amp; LOOKUP BROWSER</span><h3>Select a field</h3></div><button class="close" onclick={cancel} aria-label="Close field browser">×</button></header><div class="browser-search"><input class="browse-search" type="search" value={browseSearch} onchange={browseSearchChange} aria-label="Search fields at this lookup level" placeholder="Search fields at this level…"/></div><div class="browser-grid"><nav class="path-panel" aria-label="Lookup path"><h4>Lookup path</h4><template for:each={pathNodes} for:item="node"><button key={node.id} class={node.cls} data-index={node.index} onclick={jump}><strong>{node.label}</strong><small>{node.object}</small></button></template><small>Root: {objectApiName}<br/>Lookup hops: {depth} / 5</small></nav><main class="browser-main"><div class="breadcrumbs"><template lwc:if={canBack}><button onclick={back}>← Back</button></template><strong>{breadcrumb}</strong></div><template lwc:if={browseLoading}><p class="loading" role="status">Loading readable fields…</p></template><template lwc:if={browseError}><div class="error" role="alert">{browseError}<button onclick={retry}>Retry</button></div></template><h4>{currentObject} fields</h4><div class="browser-fields"><template for:each={browseRows} for:item="field"><label key={field.path} class="browse-field"><input type="radio" name="lookupField" value={field.apiName} checked={field.checked} onchange={selectDraft}/><span><strong>{field.label}</strong><small>{field.apiName}</small></span><span class="type">{field.type}</span></label></template><template lwc:if={noBrowseFields}><p class="empty">No fields match your search.</p></template></div><h4 class="lookup-heading">More parent lookups</h4><div class="lookup-list"><template for:each={parentLookups} for:item="lookup"><div key={lookup.apiName} class="lookup-card"><button class="lookup-button" disabled={lookup.disabled} data-name={lookup.apiName} onclick={explore}><span><strong>{lookup.label}</strong><small>{lookup.relationshipName} → {lookup.hint}</small></span><span aria-hidden="true">›</span></button></div></template><template lwc:if={noLookups}><p class="empty">No matching parent lookups at this level.</p></template></div></main></div><footer><div class="selected-path"><small>Selected path</small><strong>{draftPath}</strong><template lwc:if={draftType}><span class="type">{draftType}</span></template></div><div class="footer-buttons"><button onclick={cancel}>Cancel</button><button class="primary" onclick={use} disabled={disableUse}>Use Field</button></div></footer></section></div></template></template>
