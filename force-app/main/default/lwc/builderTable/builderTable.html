<template><header><strong>{node.label}</strong><span>Custom table · sample data</span></header><template lwc:if={sourceError}><p role="alert" class="error">{sourceError}</p></template><div class="scroll"><table class={tableClass}><thead><template lwc:if={grouped}><tr class="groups"><template lwc:if={hasSelection}><th></th></template><template for:each={groups} for:item="group"><th key={group.id} colspan={group.span}>{group.label}</th></template></tr></template><tr><template lwc:if={hasSelection}><th>Select</th></template><template for:each={columns} for:item="column"><th key={column.id} style={column.style}><button type="button" data-id={column.id} onclick={selectColumn}>{column.label}</button></th></template></tr></thead><tbody><template for:each={rows} for:item="row"><tr key={row.key} class={row.cls}><template lwc:if={hasSelection}><td><input type={selectType} name={selectName} checked={row.selected} data-index={row.index} onchange={select} aria-label="Select row"/></td></template><template for:each={row.cells} for:item="cell"><td key={cell.id} style={cell.style}><template lwc:if={cell.isCheckbox}><input type="checkbox" checked={cell.checked} required={cell.required} data-index={row.index} data-id={cell.id} onchange={edit} aria-label={cell.label} aria-invalid={cell.invalid}/></template><template lwc:elseif={cell.isTextInput}><input type={cell.type} value={cell.value} required={cell.required} min={cell.min} max={cell.max} step={cell.step} data-index={row.index} data-id={cell.id} onchange={edit} aria-label={cell.label} aria-invalid={cell.invalid}/></template><template lwc:else>{cell.display}</template></td></template></tr><template lwc:if={row.hasError}><tr key={row.errorKey}><td colspan={colspan} class="error" role="alert">{row.error}</td></tr></template></template></tbody></table></div><template lwc:if={noRows}><p>No sample records.</p></template><footer><span aria-live="polite">{summary}</span><button type="button" disabled={blocked} onclick={save}>Save rows</button></footer><p class="hint" aria-live="polite">{message}</p></template>
