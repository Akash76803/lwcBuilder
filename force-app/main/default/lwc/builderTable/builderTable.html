<template><header><strong>{node.label}</strong><span>Custom table · sample data</span></header><template lwc:if={sourceError}><p role="alert" class="error">{sourceError}</p><details><summary>Row activity / output Data Packs</summary><pre>{eventJson}</pre></details><template lwc:if={hasDetail}><div class="detail-backdrop" onclick={stopDetail}><section class="row-popup" role="dialog" aria-modal="true" aria-label="Row details" onkeydown={detailKey}><header><strong>Row details</strong><button type="button" data-close-detail onclick={closeDetail}>Close</button></header><pre>{detailJson}</pre></section></div></template></template><template lwc:if={sortable}><label>Sort column <select aria-label="Sort column" onchange={sortChange}><option value="">Source order</option><template for:each={sortOptions} for:item="o"><option key={o.id} value={o.id} selected={o.selected}>{o.label}</option></template></select></label><button type="button" onclick={sortReverse} aria-pressed={descending}>Reverse sort</button></template><div class="scroll"><table class={tableClass}><thead><template lwc:if={grouped}><tr class="groups"><template lwc:if={hasSelection}><th></th></template><template for:each={groups} for:item="group"><th key={group.id} colspan={group.span}>{group.label}</th></template><template lwc:if={hasRowActions}><th></th></template></tr></template><tr><template lwc:if={hasSelection}><th>Select</th></template><template for:each={columns} for:item="column"><th key={column.id} style={column.style}><button type="button" data-id={column.id} onclick={selectColumn}>{column.label}</button></th></template><template lwc:if={hasRowActions}><th>Actions</th></template></tr></thead><tbody><template for:each={rows} for:item="row"><tr key={row.key} class={row.cls}><template lwc:if={hasSelection}><td><input type={selectType} name={selectName} checked={row.selected} data-index={row.index} data-rowid={row.rowId} onchange={select} aria-label="Select row"/></td></template><template for:each={row.cells} for:item="cell"><td key={cell.id} style={cell.style}><template lwc:if={cell.isCheckbox}><input type="checkbox" checked={cell.checked} required={cell.required} data-index={row.index} data-rowid={row.rowId} data-id={cell.id} oninput={edit} aria-label={cell.label} aria-invalid={cell.invalid}/></template><template lwc:elseif={cell.isTextInput}><input type={cell.type} value={cell.value} required={cell.required} min={cell.min} max={cell.max} step={cell.step} data-index={row.index} data-rowid={row.rowId} data-id={cell.id} oninput={edit} aria-label={cell.label} aria-invalid={cell.invalid}/></template><template lwc:else>{cell.display}</template></td></template><template lwc:if={hasRowActions}><td><button type="button" data-rowid={row.rowId} onclick={rowAction}>Row action</button></td></template></tr><template lwc:if={row.hasError}><tr key={row.errorKey}><td colspan={colspan} class="error" role="alert">{row.error}</td></tr></template></template></tbody><template lwc:if={totalsEnabled}><tfoot><tr><template lwc:if={hasSelection}><th>Total</th></template><template for:each={totalCells} for:item="cell"><td key={cell.id} style={cell.style}>{cell.display}</td></template><template lwc:if={hasRowActions}><td></td></template></tr></tfoot></template></table></div><template lwc:if={noRows}><p>No sample records.</p><details><summary>Row activity / output Data Packs</summary><pre>{eventJson}</pre></details><template lwc:if={hasDetail}><div class="detail-backdrop" onclick={stopDetail}><section class="row-popup" role="dialog" aria-modal="true" aria-label="Row details" onkeydown={detailKey}><header><strong>Row details</strong><button type="button" data-close-detail onclick={closeDetail}>Close</button></header><pre>{detailJson}</pre></section></div></template></template><template lwc:if={pagination}><div class="paging"><button type="button" data-direction="-1" disabled={firstPage} onclick={pageMove}>Previous</button><span>{pageLabel}</span><button type="button" data-direction="1" disabled={lastPage} onclick={pageMove}>Next</button></div></template><footer><span aria-live="polite">{summary}<template lwc:if={totalsEnabled}> · Totals: {totalScopeLabel}</template></span><button type="button" disabled={blocked} onclick={save}>Save rows</button></footer><p class="hint" aria-live="polite">{message}</p><details><summary>Row activity / output Data Packs</summary><pre>{eventJson}</pre></details><template lwc:if={hasDetail}><div class="detail-backdrop" onclick={stopDetail}><section class="row-popup" role="dialog" aria-modal="true" aria-label="Row details" onkeydown={detailKey}><header><strong>Row details</strong><button type="button" data-close-detail onclick={closeDetail}>Close</button></header><pre>{detailJson}</pre></section></div></template></template>
