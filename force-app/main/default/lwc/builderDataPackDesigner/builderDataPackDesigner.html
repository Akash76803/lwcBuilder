<template><section class="designer">
<header class="topbar"><div><span class="eyebrow">LWC BUILDER / DATA PACKS</span><h2>Data Pack Designer</h2><p>Design reusable output contracts. Preview uses sample data only.</p></div><div class="buttons"><button onclick={create}>New Pack</button><button onclick={example}>Load Example</button><template lwc:if={hasPack}><button onclick={validate}>Validate</button><button class="primary" onclick={publish}>Publish Sample Version</button></template></div></header>
<template lwc:if={hasPack}><div class="packbar"><label>Current pack<select onchange={changePack}><template for:each={choices} for:item="p"><option key={p.id} value={p.id} selected={p.selected}>{p.name}</option></template></select></label><label>Pack name<input value={pack.name} data-field="name" onchange={packChange}/></label><label class="description">Description<input value={pack.description} data-field="description" onchange={packChange}/></label><span class="badge">{versionLabel}</span></div>
<div class="workflow">1 · Define inputs <span>→</span> 2 · Design output <span>→</span> 3 · Configure sources <span>→</span> 4 · Map <span>→</span> 5 · Test &amp; publish</div>
<div class="columns"><aside class="card sources"><header><h3>Inputs &amp; Sources</h3></header><section><div class="section-title"><h4>Inputs</h4><button onclick={addInput}>＋ Input</button></div><template for:each={inputs} for:item="input"><button class="item" key={input.id} data-kind="input" data-id={input.id} onclick={select}><strong>{input.name}</strong><small>{input.type}</small></button></template><template lwc:if={noInputs}><p class="empty">Add parameters the pack needs to run.</p></template><div class="section-title"><h4>Sources</h4><button onclick={addSource}>＋ Source</button></div><template for:each={sources} for:item="source"><button class="item" key={source.id} data-kind="source" data-id={source.id} onclick={select}><strong>{source.name}</strong><small>{source.object}</small></button></template><template lwc:if={noSources}><p class="empty">Choose objects and supply sample records.</p></template></section></aside>
<main class="card output"><header><h3>Output Designer</h3><div class="buttons"><button data-kind="Object" onclick={addOutput}>＋ Object</button><button data-kind="List" onclick={addOutput}>＋ List</button><button data-kind="Value" onclick={addOutput}>＋ Value</button></div></header><p class="hint">Select an Object or List to add children. Value nodes use their parent.</p><div class="tree"><template for:each={tree} for:item="row"><button class={row.cls} style={row.indent} key={row.id} data-kind="output" data-id={row.id} onclick={select}><span class="node-name">{row.name}</span><span class="node-kind">{row.kind}</span></button></template></div></main>
<aside class="card mapping"><header><h3>Configure: {mappingTitle}</h3></header><section><template lwc:if={hasSelection}><label>Name<input readonly={isRoot} value={selected.name} data-field="name" onchange={selectedChange}/></label>
<template lwc:if={isInput}><label>Type<select data-field="type" onchange={selectedChange}><template for:each={types} for:item="t"><option key={t.value} value={t.value} selected={t.selected}>{t.value}</option></template></select></label><label class="checkbox"><input type="checkbox" checked={selected.required} data-field="required" onchange={selectedChange}/>Required</label><label>Default value<input value={selected.defaultValue} data-field="defaultValue" onchange={selectedChange}/></label><p class="hint">Boolean defaults: true / false. Live component input values are bound separately.</p><button class="danger" onclick={removeSelected}>Remove input</button></template>
<template lwc:if={isSource}><c-builder-schema-picker data={selected} ondatachange={schemaChange}></c-builder-schema-picker><template lwc:if={selected.relatedSource}><p class="hint">Related context must be expressed as an explicit filter or output join for sample preview.</p><button onclick={clearRelated}>Clear related context</button></template><details open><summary>Visual filters · AND</summary><template for:each={filters} for:item="f"><div class="filter" key={f.id}><label>Field API path<input value={f.field} data-id={f.id} data-field="field" onchange={filterChange}/></label><label>Operator<select data-id={f.id} data-field="operator" onchange={filterChange}><template for:each={f.ops} for:item="op"><option key={op.value} value={op.value} selected={op.selected}>{op.value}</option></template></select></label><label>Value from<select data-id={f.id} data-field="valueKind" onchange={filterChange}><template for:each={f.kinds} for:item="kind"><option key={kind.value} value={kind.value} selected={kind.selected}>{kind.value}</option></template></select></label><template lwc:if={f.isInput}><label>Input<select data-id={f.id} data-field="value" onchange={filterChange}><option value="">Choose input</option><template for:each={f.inputOptions} for:item="i"><option key={i.value} value={i.value} selected={i.selected}>{i.label}</option></template></select></label></template><template lwc:else><label>Value<input value={f.value} data-id={f.id} data-field="value" onchange={filterChange}/></label></template><button class="danger" data-id={f.id} onclick={removeFilter}>Remove filter</button></div></template><button onclick={addFilter}>＋ Filter</button></details><label>Sort field<input value={selected.sortField} data-field="sortField" onchange={selectedChange}/></label><label>Direction<select data-field="sortDirection" onchange={selectedChange}><template for:each={sortOptions} for:item="s"><option key={s.value} value={s.value} selected={s.selected}>{s.value}</option></template></select></label><label>Row limit<input type="number" min="1" max="500" value={selected.limit} data-field="limit" onchange={selectedChange}/></label><label>Sample records · JSON array<textarea class="json-input" value={selected.sampleJson} data-field="sampleJson" onchange={selectedChange}></textarea></label><p class="hint">Include mapped fields and matching keys. No SOQL runs in this phase.</p><button class="danger" onclick={removeSelected}>Remove source</button></template>
<template lwc:if={isOutput}><template lwc:if={isContainer}><label>Source<select data-field="sourceId" onchange={selectedChange}><option value="">Grouping object / inherited record</option><template for:each={sourceOptions} for:item="s"><option key={s.value} value={s.value} selected={s.selected}>{s.label}</option></template></select></label><template lwc:if={isList}><p class="hint">One-to-many · No matching records produce an empty list.</p></template><template lwc:else><p class="hint">Single record · No match gives null. Multiple records require a filter or List.</p></template><label>Parent record key<input value={selected.parentField} data-field="parentField" onchange={selectedChange} placeholder="Id"/></label><label>Source matching field<input value={selected.matchField} data-field="matchField" onchange={selectedChange} placeholder="AccountId"/></label><p class="hint">Leave both keys empty for an independent source.</p></template>
<template lwc:if={isValue}><label>Output type<select data-field="type" onchange={selectedChange}><template for:each={types} for:item="t"><option key={t.value} value={t.value} selected={t.selected}>{t.value}</option></template></select></label><label>Value from<select data-field="mode" onchange={selectedChange}><template for:each={modes} for:item="m"><option key={m.value} value={m.value} selected={m.selected}>{m.label}</option></template></select></label><template lwc:if={fieldMode}><label>Source field<select data-field="field" onchange={selectedChange}><option value="">Choose field</option><template for:each={fieldOptions} for:item="f"><option key={f.value} value={f.value} selected={f.selected}>{f.value}</option></template></select></label><label>Field API path<input value={selected.field} data-field="field" onchange={selectedChange} placeholder="Name or Account.Name"/></label></template><template lwc:if={inputMode}><label>Input<select data-field="inputId" onchange={selectedChange}><option value="">Choose input</option><template for:each={inputOptions} for:item="i"><option key={i.value} value={i.value} selected={i.selected}>{i.label}</option></template></select></label></template><template lwc:if={constantMode}><label>Constant<input value={selected.constant} data-field="constant" onchange={selectedChange}/></label></template><template lwc:if={countMode}><label>Count records from<select data-field="sourceId" onchange={selectedChange}><option value="">Choose source</option><template for:each={sourceOptions} for:item="s"><option key={s.value} value={s.value} selected={s.selected}>{s.label}</option></template></select></label><p class="hint">Counts source rows after filters and limit; not an output-list aggregate.</p></template></template><template lwc:if={canDeleteOutput}><button class="danger" onclick={removeSelected}>Remove node &amp; children</button></template></template>
</template></section></aside></div>
<section class="card preview"><header><div class="buttons"><template for:each={tabs} for:item="tab"><button key={tab.label} class={tab.cls} data-tab={tab.label} onclick={previewSwitch}>{tab.label}</button></template></div><button class="primary" onclick={run}>Run Sample Preview</button></header><div class="preview-grid"><div><h4>Sample inputs</h4><template for:each={sampleInputs} for:item="input"><label key={input.id}>{input.name} · {input.type}<input value={input.value} data-id={input.id} onchange={testChange}/></label></template><p class="hint">No org records queried. Save JSON from the builder toolbar to retain drafts and versions.</p><template for:each={versions} for:item="v"><p class="version" key={v.version}>Published sample version {v.version} · {v.date}</p></template></div><div><template lwc:if={showOutput}><pre>{preview}</pre></template><template lwc:if={showValidation}><template for:each={indexedIssues} for:item="issue"><p class="error" key={issue.key}><strong>{issue.path}</strong> {issue.message}</p></template><template lwc:if={noIssues}><p class="hint">Click Validate to check the current configuration.</p></template></template><template lwc:if={showExecution}><template for:each={execution} for:item="row"><p class="execution" key={row.id}>{row.name} · {row.rows} records · {row.mode}</p></template></template></div></div></section><template lwc:if={message}><pre class="message" role="status">{message}</pre></template>
</template><template lwc:else><div class="welcome"><h3>Create your first data pack</h3><p>Define inputs, choose sources, build nested output and connect mappings.</p><button class="primary" onclick={create}>Create Blank Pack</button><button onclick={example}>Load Sample Template</button></div></template></section></template>
