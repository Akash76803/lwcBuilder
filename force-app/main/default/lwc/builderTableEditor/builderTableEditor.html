<template><nav aria-label="Table configuration sections"><template for:each={tabs} for:item="tab"><button key={tab.label} type="button" class={tab.cls} data-tab={tab.label} onclick={tabChange}>{tab.label}</button></template></nav><div class="toolbar"><template lwc:if={isCell}><button type="button" onclick={add}>＋ Add column</button></template><button type="button" class="primary" onclick={apply}>Apply table</button></div><p class="hint">{dirtyText}</p><template lwc:if={error}><p class="error" role="alert">{error}</p></template><template lwc:if={showColumns}><div class="column-list"><template for:each={columns} for:item="column"><button key={column.id} type="button" class={column.cls} data-id={column.id} onclick={select}>{column.label}</button></template></div></template>
<template lwc:if={isCell}><template lwc:if={hasCurrent}><h3>Cell configuration</h3><label>Column label<input value={current.label} data-key="label" onchange={change}/></label><label>Value source<select data-key="source" onchange={change}><template for:each={sources} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><template lwc:if={isField}><label>Data Pack / sample row field<select data-key="path" onchange={change}><option value="">Choose field</option><template for:each={fieldOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label></template><template lwc:if={isInput}><label>Input type<select data-key="inputType" onchange={change}><template for:each={inputTypes} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Save input as (row key)<input value={current.key} data-key="key" onchange={change}/></label><p class="hint">Example: remarks stores each row's input as row.remarks.</p><template lwc:if={defaultCheckbox}><label class="check"><input type="checkbox" checked={defaultChecked} data-key="defaultValue" onchange={change}/>Default checked</label></template><template lwc:else><label>Default value<input value={current.defaultValue} data-key="defaultValue" onchange={change}/></label></template><label class="check"><input type="checkbox" checked={current.readonly} data-key="readonly" onchange={change}/>Read-only cell</label><label class="check"><input type="checkbox" checked={current.required} data-key="required" onchange={change}/>Required</label><template lwc:if={isNumeric}><label>Minimum<input type="number" value={current.min} data-key="min" onchange={change}/></label><label>Maximum<input type="number" value={current.max} data-key="max" onchange={change}/></label></template></template><template lwc:if={isCalculated}><p class="hint">Edit this column in Formulas.</p></template><div class="toolbar"><button type="button" disabled={atStart} data-direction="-1" onclick={move}>← Move</button><button type="button" disabled={atEnd} data-direction="1" onclick={move}>Move →</button><button type="button" onclick={remove}>Remove</button></div></template></template>
<template lwc:if={isDesign}><h3>Table design</h3><label class="check"><input type="checkbox" checked={totalsEnabled} data-scope="totals" data-key="enabled" onchange={change}/>Show total row</label><template lwc:if={totalsEnabled}><label>Total rows<select data-scope="totals" data-key="scope" onchange={change}><template for:each={totalScopes} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><p class="hint">Choose each column and its aggregate under Selected column design &amp; totals. Average is arithmetic; blank cells are excluded.</p></template><label>Density<select data-scope="design" data-key="density" onchange={change}><template for:each={densities} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Row selection<select data-scope="design" data-key="selection" onchange={change}><template for:each={selections} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label class="check"><input type="checkbox" checked={config.grouped} data-scope="design" data-key="grouped" onchange={change}/>Grouped headers</label><label class="check"><input type="checkbox" checked={config.grid} data-scope="design" data-key="grid" onchange={change}/>Vertical grid</label><label class="check"><input type="checkbox" checked={config.striped} data-scope="design" data-key="striped" onchange={change}/>Alternate rows</label><details><summary>Sorting &amp; pagination</summary><label class="check"><input type="checkbox" checked={sortEnabled} data-scope="view" data-key="sortable" onchange={change}/>Enable sorting</label><label>Page size (0 = all)<select data-scope="view" data-key="pageSize" onchange={change}><template for:each={pageSizes} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label></details><details><summary>Selected column design &amp; totals</summary><template lwc:if={hasCurrent}><h3>{current.label}</h3><label>Total row aggregate<select data-key="aggregate" onchange={change}><template for:each={aggregateOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Header group<input value={current.group} data-key="group" onchange={change}/></label><label>Width (60–600 px)<input type="number" min="60" max="600" value={current.width} data-key="width" onchange={change}/></label><label>Alignment<select data-key="align" onchange={change}><template for:each={aligns} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label class="check"><input type="checkbox" checked={current.visible} data-key="visible" onchange={change}/>Visible</label></template></details></template>
<template lwc:if={isCalculate}><h3>Formulas &amp; calculations</h3><template lwc:if={hasCurrent}><label>Column label<input value={current.label} data-key="label" onchange={change}/></label></template><button type="button" onclick={addFormula}>＋ Formula column</button><p class="hint">Select a calculated column. Existing formulas, math operations and discount calculations are retained.</p><template lwc:if={isCalculated}><label>Calculation<select data-key="calculation" onchange={change}><template for:each={calculations} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><template lwc:if={isFormula}><label>Formula<textarea data-key="formulaText" onchange={change}>{formulaText}</textarea></label><div class="tokens"><template for:each={tokens} for:item="token"><button key={token.id} type="button" data-id={token.id} onclick={insertToken}>{token.label}</button></template></div><p class="hint">Header tokens · + − * / · ROUND, IF, SUM, MIN, MAX · AND / OR / NOT. References use stable column IDs after Apply.</p></template><template lwc:if={math}><label>Left column<select data-key="left" onchange={change}><template for:each={leftOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Right column<select data-key="right" onchange={change}><template for:each={rightOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label></template></template><details><summary>Optional discount calculator</summary><label class="check"><input type="checkbox" checked={discountsEnabled} data-scope="discounts" data-key="enabled" onchange={change}/>Enable optional discounts</label><template lwc:if={discountsEnabled}><label>Quantity column<select data-scope="discounts" data-key="quantity" onchange={change}><option value="">Choose column</option><template for:each={quantityOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Unit price column<select data-scope="discounts" data-key="price" onchange={change}><option value="">Choose column</option><template for:each={priceOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Discount base<select data-scope="discounts" data-key="mode" onchange={change}><template for:each={modes} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><p class="hint">same = original gross; sequential = remaining amount in column order. Hidden discount columns still calculate.</p><template for:each={discounts} for:item="d"><label key={d.id}>{d.label}<select data-scope="discountColumn" data-id={d.id} data-key="discount" onchange={change}><template for:each={d.typeOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label></template><button type="button" onclick={addTotals}>Add totals + 100% / net rules</button><p class="hint">Gross = Quantity × Price. Effective % = Discount amount ÷ Gross × 100. Zero gross rejects positive discounts.</p></template></details></template>
<template lwc:if={isRules}><h3>Row validation</h3><button type="button" onclick={addRule}>＋ Add row rule</button><template for:each={rules} for:item="r"><section key={r.id} class="rule"><label class="check"><input type="checkbox" checked={r.enabled} data-scope="rule" data-id={r.id} data-key="enabled" onchange={change}/>Enable rule</label><label>Kind<select data-scope="rule" data-id={r.id} data-key="kind" onchange={change}><template for:each={r.kindOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><template lwc:if={r.isFormula}><label>Error trigger<select data-scope="rule" data-id={r.id} data-key="formulaTrigger" onchange={change}><template for:each={r.triggerOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Validation condition (formula)<textarea data-scope="rule" data-id={r.id} data-key="formulaText" onchange={change}>{r.formulaText}</textarea></label><div class="tokens"><template for:each={r.tokens} for:item="token"><button key={token.id} type="button" data-id={token.id} data-rule={r.id} onclick={insertToken}>{token.label}</button></template></div><p class="hint">Default: true shows error. Example: [My stock] &lt; [Quantity] or [Total Discount %] &gt; 100.</p></template><template lwc:if={r.compare}><label>Left column<select data-scope="rule" data-id={r.id} data-key="left" onchange={change}><template for:each={r.leftOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Allowed comparison<select data-scope="rule" data-id={r.id} data-key="operator" onchange={change}><template for:each={r.operatorOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Compare with<select data-scope="rule" data-id={r.id} data-key="rightKind" onchange={change}><template for:each={r.rightKinds} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><template lwc:if={r.isColumn}><label>Right column<select data-scope="rule" data-id={r.id} data-key="right" onchange={change}><template for:each={r.rightOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label></template><template lwc:if={r.isField}><label>Same row field<select data-scope="rule" data-id={r.id} data-key="right" onchange={change}><template for:each={r.fieldOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label></template><template lwc:if={r.isConstant}><label>Constant<input type="number" value={r.right} data-scope="rule" data-id={r.id} data-key="right" onchange={change}/></label></template></template><label>On failure<select data-scope="rule" data-id={r.id} data-key="effect" onchange={change}><template for:each={r.effects} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Error / warning message<input value={r.message} data-scope="rule" data-id={r.id} data-key="message" onchange={change}/></label><p class="hint">Current row values: &#123;[Discount]&#125;, &#123;[Quantity]&#125; (use your exact column label). Comparison rules also support &#123;value&#125; / &#123;limit&#125;.</p><button type="button" data-id={r.id} onclick={removeRule}>Remove rule</button></section></template></template>
<template lwc:if={isSource}><h3>Source &amp; row identity</h3><button type="button" onclick={configureBinding}>Choose Data Pack / object source</button><p class="hint">Source binding is configured in Bindings. Row keys stay attached to edits and selections when source rows reorder.</p><label>Identity mode<select data-scope="identity" data-key="mode" onchange={change}><template for:each={identityModes} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><template lwc:if={hasIdentityFields}><label>Primary key field<select data-scope="identity" data-key="first" onchange={identityFieldChange}><option value="">Choose field</option><template for:each={identityFirstOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><template lwc:if={isComposite}><label>Second key field<select data-scope="identity" data-key="second" onchange={identityFieldChange}><option value="">Choose field</option><template for:each={identitySecondOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label></template><p class="hint">Missing or duplicate keys block row operations. Use source fields, not editable inputs.</p></template><template lwc:else><p class="hint">Temporary row IDs are session-only. Use a field or composite key for persisted records.</p></template></template>
<template lwc:if={isOutputs}><h3>Output Data Packs</h3><button type="button" onclick={addPack}>＋ Output pack</button><p class="hint">Each item carries rowId, full row data, column values and validation issues. Runtime contents are session-only; definitions save with your project.</p><template for:each={packs} for:item="p"><section key={p.id} class="rule"><label>Pack name<input value={p.name} data-scope="pack" data-id={p.id} data-key="name" onchange={change}/></label><label>Update mode<select data-scope="pack" data-id={p.id} data-key="updateMode" onchange={change}><template for:each={p.modes} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><template lwc:if={p.snapshot}><label>Rows included<select data-scope="pack" data-id={p.id} data-key="scope" onchange={change}><template for:each={p.scopes} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><template lwc:if={p.filtered}><label>Include row when (true)<textarea data-scope="pack" data-id={p.id} data-key="conditionText" onchange={change}>{p.conditionText}</textarea></label><div class="tokens"><template for:each={p.tokens} for:item="t"><button key={t.id} type="button" data-id={t.id} data-target={p.id} data-scope="pack" onclick={insertConditionToken}>{t.label}</button></template></div></template></template><template lwc:else><p class="hint">Events &amp; Actions adds, updates or removes rows by row ID in this pack.</p></template><button type="button" data-id={p.id} onclick={removePack}>Remove pack</button></section></template></template>
<template lwc:if={isEvents}><h3>Events &amp; Actions</h3><button type="button" onclick={addEventAction}>＋ Event action</button><p class="hint">Uses the entire current row. Save processes changed rows. Actions manage local Data Packs or show row details; Salesforce writes and arbitrary component operations connect later.</p><template for:each={eventActions} for:item="a"><section key={a.id} class="rule"><label class="check"><input type="checkbox" checked={a.enabled} data-scope="eventAction" data-id={a.id} data-key="enabled" onchange={change}/>Enabled</label><label>Event<select data-scope="eventAction" data-id={a.id} data-key="event" onchange={change}><template for:each={a.events} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><template lwc:if={a.isSelectionEvent}><label>Selection state<select data-scope="eventAction" data-id={a.id} data-key="selectionTrigger" onchange={change}><template for:each={a.selectionOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label></template><label>Action<select data-scope="eventAction" data-id={a.id} data-key="action" onchange={change}><template for:each={a.actions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><template lwc:if={a.needsPack}><label>Target pack<select data-scope="eventAction" data-id={a.id} data-key="packId" onchange={change}><option value="">Choose an action-managed pack</option><template for:each={a.packs} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label></template><label>Run when (true; blank = always)<textarea data-scope="eventAction" data-id={a.id} data-key="conditionText" onchange={change}>{a.conditionText}</textarea></label><div class="tokens"><template for:each={a.tokens} for:item="t"><button key={t.id} type="button" data-id={t.id} data-target={a.id} data-scope="eventAction" onclick={insertConditionToken}>{t.label}</button></template></div><label class="check"><input type="checkbox" checked={a.requireValid} data-scope="eventAction" data-id={a.id} data-key="requireValid" onchange={change}/>Require valid row</label><button type="button" data-id={a.id} onclick={removeEventAction}>Remove action</button></section></template></template>
</template>
