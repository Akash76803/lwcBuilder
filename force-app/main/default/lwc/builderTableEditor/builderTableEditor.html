<template><div class="toolbar"><button type="button" onclick={add}>＋ Add column</button><button type="button" class="primary" onclick={apply}>Apply table</button></div><p class="hint">{dirtyText}</p><template lwc:if={error}><p class="error" role="alert">{error}</p></template><template lwc:if={showColumns}><div class="column-list"><template for:each={columns} for:item="column"><button key={column.id} type="button" class={column.cls} data-id={column.id} onclick={select}>{column.label}</button></template></div></template><nav><template for:each={tabs} for:item="tab"><button key={tab.label} type="button" class={tab.cls} data-tab={tab.label} onclick={tabChange}>{tab.label}</button></template></nav>
<template lwc:if={isCell}><template lwc:if={hasCurrent}><h3>Cell configuration</h3><label>Column label<input value={current.label} data-key="label" onchange={change}/></label><label>Value source<select data-key="source" onchange={change}><template for:each={sources} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><template lwc:if={isField}><label>Data Pack / sample row field<select data-key="path" onchange={change}><option value="">Choose field</option><template for:each={fieldOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label></template><template lwc:if={isInput}><label>Input type<select data-key="inputType" onchange={change}><template for:each={inputTypes} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Save input as (row key)<input value={current.key} data-key="key" onchange={change}/></label><p class="hint">Example: remarks stores each row's input as row.remarks.</p><template lwc:if={defaultCheckbox}><label class="check"><input type="checkbox" checked={defaultChecked} data-key="defaultValue" onchange={change}/>Default checked</label></template><template lwc:else><label>Default value<input value={current.defaultValue} data-key="defaultValue" onchange={change}/></label></template><label class="check"><input type="checkbox" checked={current.required} data-key="required" onchange={change}/>Required</label><template lwc:if={isNumeric}><label>Minimum<input type="number" value={current.min} data-key="min" onchange={change}/></label><label>Maximum<input type="number" value={current.max} data-key="max" onchange={change}/></label></template></template><template lwc:if={isCalculated}><label>Calculation<select data-key="calculation" onchange={change}><template for:each={calculations} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><template lwc:if={isFormula}><label>Formula<textarea data-key="formulaText" onchange={change}>{formulaText}</textarea></label><div class="tokens"><template for:each={tokens} for:item="token"><button key={token.id} type="button" data-id={token.id} onclick={insertToken}>{token.label}</button></template></div><p class="hint">Header tokens · + − * / · ROUND, IF, SUM, MIN, MAX · AND / OR / NOT. References use stable column IDs after Apply.</p></template><template lwc:if={math}><label>Left column<select data-key="left" onchange={change}><template for:each={leftOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Right column<select data-key="right" onchange={change}><template for:each={rightOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label></template></template><div class="toolbar"><button type="button" disabled={atStart} data-direction="-1" onclick={move}>← Move</button><button type="button" disabled={atEnd} data-direction="1" onclick={move}>Move →</button><button type="button" onclick={remove}>Remove</button></div></template></template>
<template lwc:if={isDesign}><h3>Table design</h3><label class="check"><input type="checkbox" checked={totalsEnabled} data-scope="totals" data-key="enabled" onchange={change}/>Show total row</label><template lwc:if={totalsEnabled}><label>Total rows<select data-scope="totals" data-key="scope" onchange={change}><template for:each={totalScopes} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><p class="hint">Choose each column and its aggregate under Selected column design &amp; totals. Average is arithmetic; blank cells are excluded.</p></template><label>Density<select data-scope="design" data-key="density" onchange={change}><template for:each={densities} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Row selection<select data-scope="design" data-key="selection" onchange={change}><template for:each={selections} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label class="check"><input type="checkbox" checked={config.grouped} data-scope="design" data-key="grouped" onchange={change}/>Grouped headers</label><label class="check"><input type="checkbox" checked={config.grid} data-scope="design" data-key="grid" onchange={change}/>Vertical grid</label><label class="check"><input type="checkbox" checked={config.striped} data-scope="design" data-key="striped" onchange={change}/>Alternate rows</label><details><summary>Selected column design &amp; totals</summary><template lwc:if={hasCurrent}><h3>{current.label}</h3><label>Total row aggregate<select data-key="aggregate" onchange={change}><template for:each={aggregateOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Header group<input value={current.group} data-key="group" onchange={change}/></label><label>Width (60–600 px)<input type="number" min="60" max="600" value={current.width} data-key="width" onchange={change}/></label><label>Alignment<select data-key="align" onchange={change}><template for:each={aligns} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label class="check"><input type="checkbox" checked={current.visible} data-key="visible" onchange={change}/>Visible</label></template></details></template>
<template lwc:if={isCalculate}><h3>Calculations</h3><button type="button" onclick={addFormula}>＋ Formula column</button><p class="hint">Choose a calculated column in the column list, then edit its formula in Cell. Example: [Unit price ₹] * [Quantity]. Formula dependencies update automatically.</p><details><summary>Optional discount calculator</summary><label class="check"><input type="checkbox" checked={discountsEnabled} data-scope="discounts" data-key="enabled" onchange={change}/>Enable optional discounts</label><template lwc:if={discountsEnabled}><label>Quantity column<select data-scope="discounts" data-key="quantity" onchange={change}><option value="">Choose column</option><template for:each={quantityOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Unit price column<select data-scope="discounts" data-key="price" onchange={change}><option value="">Choose column</option><template for:each={priceOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Discount base<select data-scope="discounts" data-key="mode" onchange={change}><template for:each={modes} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><p class="hint">same = original gross; sequential = remaining amount in column order. Hidden discount columns still calculate.</p><template for:each={discounts} for:item="d"><label key={d.id}>{d.label}<select data-scope="discountColumn" data-id={d.id} data-key="discount" onchange={change}><template for:each={d.typeOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label></template><button type="button" onclick={addTotals}>Add totals + 100% / net rules</button><p class="hint">Gross = Quantity × Price. Effective % = Discount amount ÷ Gross × 100. Zero gross rejects positive discounts.</p></template></details></template>
<template lwc:if={isRules}><h3>Row validation</h3><button type="button" onclick={addRule}>＋ Add row rule</button><template for:each={rules} for:item="r"><section key={r.id} class="rule"><label class="check"><input type="checkbox" checked={r.enabled} data-scope="rule" data-id={r.id} data-key="enabled" onchange={change}/>Enable rule</label><label>Kind<select data-scope="rule" data-id={r.id} data-key="kind" onchange={change}><template for:each={r.kindOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><template lwc:if={r.isFormula}><label>Error trigger<select data-scope="rule" data-id={r.id} data-key="formulaTrigger" onchange={change}><template for:each={r.triggerOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Validation condition (formula)<textarea data-scope="rule" data-id={r.id} data-key="formulaText" onchange={change}>{r.formulaText}</textarea></label><div class="tokens"><template for:each={r.tokens} for:item="token"><button key={token.id} type="button" data-id={token.id} data-rule={r.id} onclick={insertToken}>{token.label}</button></template></div><p class="hint">Default: true shows error. Example: [My stock] &lt; [Quantity] or [Total Discount %] &gt; 100.</p></template><template lwc:if={r.compare}><label>Left column<select data-scope="rule" data-id={r.id} data-key="left" onchange={change}><template for:each={r.leftOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Allowed comparison<select data-scope="rule" data-id={r.id} data-key="operator" onchange={change}><template for:each={r.operatorOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Compare with<select data-scope="rule" data-id={r.id} data-key="rightKind" onchange={change}><template for:each={r.rightKinds} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><template lwc:if={r.isColumn}><label>Right column<select data-scope="rule" data-id={r.id} data-key="right" onchange={change}><template for:each={r.rightOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label></template><template lwc:if={r.isField}><label>Same row field<select data-scope="rule" data-id={r.id} data-key="right" onchange={change}><template for:each={r.fieldOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label></template><template lwc:if={r.isConstant}><label>Constant<input type="number" value={r.right} data-scope="rule" data-id={r.id} data-key="right" onchange={change}/></label></template></template><label>On failure<select data-scope="rule" data-id={r.id} data-key="effect" onchange={change}><template for:each={r.effects} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><label>Error / warning message<input value={r.message} data-scope="rule" data-id={r.id} data-key="message" onchange={change}/></label><p class="hint">Current row values: &#123;[Discount]&#125;, &#123;[Quantity]&#125; (use your exact column label). Comparison rules also support &#123;value&#125; / &#123;limit&#125;.</p><button type="button" data-id={r.id} onclick={removeRule}>Remove rule</button></section></template></template>
</template>
