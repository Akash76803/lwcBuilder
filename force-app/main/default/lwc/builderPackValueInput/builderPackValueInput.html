<template><label>{label}<template lwc:if={isBoolean}><select onchange={change}><template for:each={options} for:item="option"><option key={option.value} value={option.value} selected={option.selected}>{option.label}</option></template></select></template><template lwc:elseif={isJson}><textarea value={text} onchange={change} spellcheck="false"></textarea></template><template lwc:else><input type={inputType} value={text} step="any" onchange={change}/></template></label><template lwc:if={hint}><small>{hint}</small></template></template>
