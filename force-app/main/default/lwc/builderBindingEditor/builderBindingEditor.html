<template><template lwc:if={supported}><section class="binding"><h3>Value binding</h3><label>Value source<select class="value-source" onchange={sourceChange}><template for:each={sources} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><p>{expected}</p><template lwc:if={isState}><label>State variable<select class="state-key" onchange={keyChange}><option value="">Choose variable…</option><template for:each={stateOptions} for:item="o"><option key={o.key} value={o.key} selected={o.selected}>{o.key}</option></template></select></label><template lwc:if={noCompatible}><p>Create a variable of the expected type below.</p></template><p>Valid edits update State and all controls bound to this variable.</p></template><template lwc:elseif={isStatic}><p>Set the default value in Properties.</p></template><template lwc:else><p>Choose a published Pack, version and output field below. Sample binding reads from the Pack.</p></template></section></template>
<details class="variables" open><summary>Screen State variables</summary><p>Defaults are saved in JSON. Runtime edits are session-only; Preview starts from defaults. Changing definitions resets runtime State.</p><template lwc:if={error}><p class="error" role="alert">{error}</p></template><template for:each={variables} for:item="v"><div key={v.key} class="variable"><strong>{v.key}</strong><span>{v.type}</span><c-builder-pack-value-input label="Default value" type={v.type} value={v.defaultValue} data-key={v.key} onvaluechange={changeDefault}></c-builder-pack-value-input><small>Current: {v.current}</small><button data-key={v.key} onclick={remove}>Delete variable</button></div></template><label>New variable key<input class="new-state-key" value={newKey} onchange={newKeyChange} placeholder="selectedRetailerId"/></label><label>Type<select class="new-state-type" onchange={newTypeChange}><template for:each={types} for:item="t"><option key={t.value} value={t.value} selected={t.selected}>{t.value}</option></template></select></label><button class="add-state" onclick={add}>＋ Add variable</button></details></template>
