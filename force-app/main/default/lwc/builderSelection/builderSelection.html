<template><div class="selection"><label>{label}<template lwc:if={required}><span class="required"> *</span></template></label>
<div class="pills"><template for:each={selectedItems} for:item="item"><span key={item.value} class="pill"><lightning-icon icon-name={icon} size="xx-small" alternative-text="Selection"></lightning-icon><span>{item.label}</span><button type="button" data-value={item.value} disabled={disabled} aria-label={item.removeLabel} onclick={remove}>×</button></span></template></div>
<template lwc:if={hideSearch}></template><template lwc:else><lightning-input type="search" label={label} variant="label-hidden" value={search} placeholder={placeholder} disabled={disabled} onchange={searchChange}></lightning-input>
<template lwc:if={picklist}><div class="tools"><button type="button" onclick={selectAll} disabled={disableSelectAll}>Select visible</button><button type="button" onclick={clear} disabled={disableClear}>Clear selections</button></div></template>
<div class="results"><template for:each={results} for:item="item"><div key={item.value}><template lwc:if={picklist}><label class="choice"><input type="checkbox" data-value={item.value} checked={item.checked} disabled={item.disabled} onchange={check}/>{item.label}</label></template><template lwc:else><button class="record" type="button" data-value={item.value} disabled={item.disabled} onclick={pick}><lightning-icon icon-name={icon} size="small" alternative-text="Record"></lightning-icon><span>{item.label}<small>{item.detail}</small></span></button></template></div></template><template lwc:if={empty}><p>No matching options</p></template></div></template>
<template lwc:if={message}><p class="error" role="alert">{message}</p></template><p class="count" aria-live="polite">{count} selected</p>
</div></template>
