<template><div class={selectionClass} onkeydown={keydown} onpointerdown={insidePointer}><label>{label}<template lwc:if={required}><span class="required"> *</span></template></label>
<div class="control"><template for:each={firstItems} for:item="item"><span key={item.value} class="pill compact"><span title={item.label}>{item.label}</span><button type="button" data-value={item.value} disabled={disabled} aria-label={item.removeLabel} onclick={remove}>×</button></span></template><template lwc:if={hasExtra}><button class="extra" type="button" disabled={disabled} aria-label={extraLabel} onclick={showSelected}>+{extraCount}</button></template><lightning-icon icon-name="utility:search" size="xx-small" alternative-text="Search"></lightning-icon><input class="query" type="search" value={search} placeholder={placeholder} disabled={disabled} aria-label={searchLabel} aria-expanded={opened} aria-controls="dropdown" oninput={searchChange} onfocus={open} autocomplete="off"/><button class="toggle" type="button" disabled={disabled} aria-label="Open choices" aria-expanded={opened} aria-controls="dropdown" onclick={toggle}><lightning-icon icon-name="utility:chevrondown" size="xx-small" alternative-text="Open choices"></lightning-icon></button></div>
<template lwc:if={opened}><div class="dropdown" id="dropdown"><template lwc:if={count}><div class="pills"><template for:each={selectedItems} for:item="item"><span key={item.value} class="pill"><span>{item.label}</span><button type="button" data-value={item.value} disabled={disabled} aria-label={item.removeLabel} onclick={remove}>×</button></span></template></div></template>
<template lwc:if={picklist}><div class="tools"><button type="button" onclick={selectAll} disabled={disableSelectAll}>Select visible</button><button type="button" onclick={clear} disabled={disableClear}>Clear selections</button></div></template>
<div class="results"><template for:each={results} for:item="item"><div key={item.value}><template lwc:if={picklist}><label class="choice"><input type="checkbox" data-value={item.value} checked={item.checked} disabled={item.disabled} onchange={check}/>{item.label}</label></template><template lwc:else><button class="record" type="button" data-value={item.value} disabled={item.disabled} onclick={pick}><lightning-icon icon-name={icon} size="small" alternative-text="Record"></lightning-icon><span>{item.label}<small>{item.detail}</small></span></button></template></div></template><template lwc:if={empty}><p>No matching options</p></template></div><div class="dropdown-footer"><span aria-live="polite">{count} selected</span><button type="button" class="done" onclick={done}>Done</button></div></div></template>
<template lwc:if={message}><p class="error" role="alert">{message}</p></template><span class="sr-only" aria-live="polite">{count} selected</span>
</div></template>
