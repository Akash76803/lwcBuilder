<template><section class="picker"><h3>Object, fields and relationships</h3><p class="hint">Live org metadata · Canvas still uses sample rows. Object changes reset field and filter bindings.</p>
<label>Search object API name<input value={search} onchange={searchChange} placeholder="Account, Contact or custom API name"/></label><button onclick={findObjects} disabled={busy}>Search objects</button>
<div class="results"><template for:each={objects} for:item="obj"><button key={obj.apiName} data-name={obj.apiName} onclick={chooseObject}>{obj.label} · {obj.apiName}</button></template></div><template lwc:if={hasMore}><button onclick={more} disabled={busy}>Load more objects</button></template>
<template lwc:if={busy}><p role="status">Loading org metadata…</p></template><template lwc:if={error}><p class="error" role="alert">{error}</p></template>
<h4>{breadcrumb}</h4><template lwc:if={canBack}><button onclick={back}>Back one relationship</button></template><template lwc:if={source}><p class="hint">Related source: {source}</p></template>
<label>Search fields<input value={fieldSearch} onchange={fieldSearchChange} placeholder="Label or API name"/></label><div class="fields"><template for:each={fields} for:item="field"><label key={field.path} class="field"><input type="checkbox" checked={field.checked} data-path={field.path} onchange={selectField}/><span>{field.label}<small>{field.apiName} · {field.type}</small></span></label></template></div>
<h4>Selected fields</h4><template for:each={chosen} for:item="field"><div key={field.path} class="selected"><span>{field.path}</span><button data-path={field.path} onclick={removeField} title="Remove field">Remove</button></div></template>
<h4>Parent lookup traversal</h4><template for:each={lookups} for:item="lookup"><div key={lookup.apiName}><button disabled={lookup.disabled} data-name={lookup.apiName} onclick={explore}>{lookup.label} → {lookup.relationshipName}</button><small>{lookup.hint}</small></div></template>
<h4>Related child source</h4><p class="hint">Selecting a child switches the source to that object and stores its parent ID binding. Live execution follows in the data phase.</p><template for:each={children} for:item="relation"><button key={relation.relationshipName} data-name={relation.relationshipName} onclick={child}>{relation.label} · {relation.relationshipName}</button></template>
<label>Filter configuration<textarea onchange={filterChange} placeholder="Existing filter configuration; visual rule editor follows">{legacyFilter}</textarea></label></section></template>
