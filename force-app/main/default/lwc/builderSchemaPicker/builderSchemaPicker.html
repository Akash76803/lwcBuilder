<template>
<section class="picker">
 <header class="picker-header"><div><span class="eyebrow">DATA BINDING</span><h3>Field picker</h3></div><span class="metadata-badge">Org metadata</span></header>
 <div class="source-card"><span class="caption">Source object</span><div class="source-heading"><strong>{objectName}</strong><button class="text-button" onclick={toggleObjects} aria-expanded={showObjects}>{objectButtonLabel}</button></div><template lwc:if={source}><p class="source-note">{source}</p></template></div>
 <template lwc:if={showObjects}><div class="object-picker"><label class="input-label" for="object-search">Find an object</label><div class="search-row"><input id="object-search" type="search" value={search} onchange={searchChange} placeholder="Search API name…"/><button class="primary" onclick={findObjects} disabled={busy}>Search</button></div><div class="object-list"><template for:each={objectRows} for:item="obj"><button key={obj.apiName} class={obj.cls} data-name={obj.apiName} onclick={chooseObject}><span>{obj.label}</span><small>{obj.apiName}</small></button></template><template lwc:if={noObjects}><p class="empty">No objects found. Try another API name.</p></template></div><template lwc:if={hasMore}><button class="load-more" onclick={more} disabled={busy}>Load more objects</button></template><p class="note">Changing object clears its field and filter selections.</p></div></template>
 <template lwc:if={error}><div class="error" role="alert">{error}</div></template><template lwc:if={busy}><div class="loading" role="status">Loading metadata…</div></template>
 <div class="tabs" role="tablist" aria-label="Field and relationship selection"><template for:each={tabs} for:item="tab"><button key={tab.id} class={tab.cls} role="tab" aria-selected={tab.selected} data-tab={tab.id} onclick={switchTab}>{tab.label}</button></template></div>
 <div class="path-bar"><span class="caption">Browsing</span><span class="path" title={breadcrumb}>{breadcrumb}</span><template lwc:if={canBack}><button class="back-button" onclick={back}>← Back</button></template></div>
 <template lwc:if={isFields}><div class="tab-content" role="tabpanel" aria-label="Fields"><label class="input-label" for="field-search">Find fields <span class="count">{fieldCount}</span></label><input id="field-search" type="search" value={fieldSearch} onchange={fieldSearchChange} placeholder="Search label or API name…"/><div class="field-list"><template for:each={fields} for:item="field"><label key={field.path} class="field-row"><input type="checkbox" checked={field.checked} data-path={field.path} onchange={selectField}/><span class="field-copy"><span class="field-name">{field.label}</span><small>{field.apiName}</small></span><span class="type-badge" title={field.type}>{field.type}</span></label></template><template lwc:if={noFields}><p class="empty">No fields to show. Choose an object or adjust your search.</p></template></div></div></template>
 <template lwc:if={isParents}><div class="tab-content" role="tabpanel" aria-label="Parent relationships"><p class="note">Open a lookup to pick fields from its parent.</p><label class="input-label" for="parent-search">Find parent lookup</label><input id="parent-search" type="search" value={relationshipSearch} onchange={relationshipSearchChange} placeholder="Search lookup…"/><div class="relationship-list"><template for:each={visibleLookups} for:item="lookup"><div key={lookup.apiName} class="relationship-card"><button class="relationship-button" disabled={lookup.disabled} data-name={lookup.apiName} onclick={explore}><span><strong>{lookup.label}</strong><small>{lookup.relationshipName}</small></span><span aria-hidden="true">→</span></button><p class="relationship-hint">{lookup.hint}</p></div></template><template lwc:if={noLookups}><p class="empty">No matching parent lookups.</p></template></div></div></template>
 <template lwc:if={isChildren}><div class="tab-content" role="tabpanel" aria-label="Child relationships"><p class="note">Choose related records as the new source. Fields will reset.</p><label class="input-label" for="child-search">Find child relationship</label><input id="child-search" type="search" value={relationshipSearch} onchange={relationshipSearchChange} placeholder="Search related records…"/><div class="relationship-list"><template for:each={visibleChildren} for:item="relation"><button key={relation.relationshipName} class="relationship-button child-row" data-name={relation.relationshipName} onclick={child}><span><strong>{relation.label}</strong><small>{relation.relationshipName} · {relation.foreignKey}</small></span><span aria-hidden="true">→</span></button></template><template lwc:if={noChildren}><p class="empty">No matching child relationships. Go back to the source object to browse children.</p></template></div></div></template>
 <div class="selection-card"><div class="selection-heading"><h4>Selected fields</h4><span class="count">{chosenCount}</span></div><template lwc:if={noChosen}><p class="empty compact">Select fields above to add them here.</p></template><div class="selected-list"><template for:each={chosen} for:item="field"><div key={field.path} class="selected-row"><span title={field.path}>{field.path}</span><button class="remove-button" data-path={field.path} onclick={removeField} title={field.path} aria-label="Remove selected field">×</button></div></template></div></div>
 <details class="filter-details"><summary>Advanced filter configuration</summary><label class="input-label" for="filter">Filter expression</label><textarea id="filter" onchange={filterChange} placeholder="Enter filter configuration">{legacyFilter}</textarea><p class="note">Visual filter editor follows in the next UI step.</p></details>
 <footer class="picker-footer">Selections are saved in the design. Canvas uses sample records.</footer>
</section>
</template>
