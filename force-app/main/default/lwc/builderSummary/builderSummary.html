<template><header><strong>{node.label}</strong><small>{caption}</small></header><template lwc:if={error}><p role="alert">{error}</p></template><div class="scroll"><table><thead><tr><th>Group</th><th>Rows</th><template for:each={metrics} for:item="metric"><th key={metric.id}>{metric.label}</th></template></tr></thead><tbody><template for:each={rows} for:item="row"><tr key={row.id}><th>{row.label}</th><td>{row.count}</td><template for:each={row.cells} for:item="cell"><td key={cell.id}>{cell.display}</td></template></tr></template></tbody></table></div></template>
