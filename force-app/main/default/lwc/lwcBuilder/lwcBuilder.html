<template><div class="app">
<header class="top"><div class="brand">☁ LWC Builder</div><input class="project-name" value={project.name} onchange={projectName} aria-label="Project name"/><span class="badge">Dev Org UI Demo</span><div class="spacer"></div><button data-modal="New project" onclick={open}>New</button><label class="file-button">Open<input type="file" accept=".json" onchange={importProject}/></label><button data-modal="Versions" onclick={open}>Versions</button><button onclick={save}>Save JSON</button><button data-modal="Preview" onclick={open}>Preview</button><button class="primary" data-modal="Generate & Deploy" onclick={open}>Generate &amp; Deploy</button></header>
<nav class="main-nav"><template for:each={navigation} for:item="tab"><button key={tab.label} class={tab.cls} data-tab={tab.label} onclick={nav}>{tab.label}</button></template><div class="spacer"></div><label>Target <select onchange={targetChange}><template for:each={targets} for:item="target"><option key={target.value} value={target.value} selected={target.selected}>{target.label}</option></template></select></label></nav>
<div class="status" role="status">{message}</div>
<template lwc:if={isPacks}><c-builder-data-pack-designer packs={dataPacks} onpackschange={packsChange}></c-builder-data-pack-designer></template>
<template lwc:if={showWorkspace}><div class="workspace"><aside class="palette"><div class="panel-tabs"><button data-tab="Components" onclick={paletteMode}>Components</button><button data-tab="Tree" onclick={paletteMode}>Tree</button></div><input class="search" placeholder="Search components…" value={search} onchange={searchChange}/>
<template lwc:if={isPalette}><template for:each={groups} for:item="group"><section key={group.name}><h3>{group.name}</h3><template for:each={group.items} for:item="item"><button key={item.type} class="palette-item" data-type={item.type} draggable="true" ondragstart={drag} onclick={add}><span class="block-icon">＋</span>{item.label}</button></template></section></template></template><template lwc:else><template for:each={tree} for:item="item"><button key={item.id} style={item.indent} class={item.cls} data-id={item.id} draggable="true" ondragstart={treeDrag} onclick={treeSelect}>{item.label}<small>{item.type}</small></button></template></template><p class="hint">Drag to a container or click to add. Use the tree and Move to for precise nesting.</p></aside>
<main class="canvas-area"><div class="canvas-tools"><strong>{project.name}</strong><div class="spacer"></div><button onclick={undo} disabled={disableUndo}>Undo</button><button onclick={redo} disabled={disableRedo}>Redo</button><button onclick={download}>Export JSON</button></div><div class="canvas" ondragover={allow} ondrop={drop}><template for:each={boundNodes} for:item="node"><c-builder-node key={node.id} node={node} runtime={runtime} selected-id={selectedId} onnodeselect={select} ontablecolumnselect={tableColumnSelect} onadapterevent={adapterEvent} onnodedrop={nodeDrop} ondemoaction={demoAction}></c-builder-node></template><div class="drop-hint">＋ Drop a component here to add at root</div></div></main>
<aside class="inspector"><h2>{selectedLabel}</h2><template lwc:if={isDesign}><div class="panel-tabs"><template for:each={propertyTabs} for:item="tab"><button key={tab.label} class={tab.cls} data-tab={tab.label} onclick={propTab}>{tab.label}</button></template></div></template>
<template lwc:if={hasSelected}><template lwc:if={isDesign}><div class="button-row component-actions"><button data-direction="-1" onclick={reorder}>Move up</button><button data-direction="1" onclick={reorder}>Move down</button><button class="danger" onclick={deleteNode}>Delete</button></div></template>
<template lwc:if={isProperties}><section><h3>Component properties</h3><label>Label<input value={selected.label} data-field="label" onchange={change}/></label><p class="hint">{selectedComponent}</p><template lwc:if={isTableSelected}><c-builder-table-editor node={selectedTable} paths={tablePaths} selected-column-id={tableColumnId} onrequestbinding={requestTableBinding} onpropertychange={propertyChange}></c-builder-table-editor></template><template lwc:elseif={isSummarySelected}><c-builder-summary-editor node={selectedSummary} tables={summarySources} onpropertychange={propertyChange}></c-builder-summary-editor></template><template lwc:else><c-builder-property-editor node={selected} onpropertychange={propertyChange}></c-builder-property-editor></template><details><summary>Layout &amp; structure</summary><label>Padding px<input type="number" min="0" max="80" value={selected.props.padding} data-field="padding" onchange={change}/></label><label>Width<input value={selected.props.width} data-field="width" onchange={change}/></label><label>Accent color<input type="color" value={selected.props.color} data-field="color" onchange={change}/></label><h3>Structure</h3><label>Move to<select onchange={moveTo}><option value="">Root</option><template for:each={parents} for:item="parent"><option key={parent.id} value={parent.id}>{parent.label}</option></template></select></label><div class="button-row"><button onclick={duplicate}>Duplicate</button></div><p class="hint">Component-specific settings render with sample data. Width and accent are saved configuration; Salesforce operations connect later.</p></details></section></template>
<template lwc:if={isData}><section><h3>Data Pack binding</h3><label>Pack<select data-field="packId" onchange={bindingChange}><option value="">Use legacy object binding</option><template for:each={packOptions} for:item="p"><option key={p.id} value={p.id} selected={p.selected}>{p.name}</option></template></select></label><label>Published sample version<select data-field="version" onchange={bindingChange}><option value="">Choose version</option><template for:each={versionOptions} for:item="v"><option key={v.value} value={v.value} selected={v.selected}>Version {v.value}</option></template></select></label><label>Output node<select data-field="outputPath" onchange={bindingChange}><option value="">Choose compatible output</option><template for:each={outputOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label><template for:each={bindingInputs} for:item="i"><c-builder-pack-value-input key={i.id} label={i.name} type={i.type} value={i.value} data-id={i.id} onvaluechange={bindingInputChange}></c-builder-pack-value-input></template><button onclick={clearBinding}>Clear pack binding</button><p class="hint">Tables bind Lists; forms bind Objects; value controls bind Values. Inputs are sample constants in this phase. Published versions are pinned. Save JSON to retain the project.</p></section><details class="legacy-binding"><summary>Legacy object / fields configuration</summary><c-builder-schema-picker data={selected.data} ondatachange={schemaChange}></c-builder-schema-picker></details></template>
<template lwc:if={isRules}><section><h3>Conditional rules</h3><p class="hint">Visible rules run against sample state in Preview. AND/OR is evaluated in listed order; nested groups connect later.</p><template for:each={rules} for:item="rule"><div key={rule.id} class="config-card"><label>Join<input value={rule.join} data-collection="rules" data-id={rule.id} data-field="join" onchange={rowChange} placeholder="AND / OR"/></label><label>Field / state key<input value={rule.field} data-collection="rules" data-id={rule.id} data-field="field" onchange={rowChange}/></label><label>Operator<input value={rule.operator} data-collection="rules" data-id={rule.id} data-field="operator" onchange={rowChange} placeholder="equals / not equals / contains / blank / greater than"/></label><label>Value<input value={rule.value} data-collection="rules" data-id={rule.id} data-field="value" onchange={rowChange}/></label><label>Effect<input value={rule.effect} data-collection="rules" data-id={rule.id} data-field="effect" onchange={rowChange} placeholder="Visible / Editable / Required"/></label><button data-collection="rules" data-id={rule.id} onclick={removeRow}>Remove rule</button></div></template><template lwc:if={noRules}><p>No conditions yet.</p></template><button onclick={addRule}>＋ Add condition</button></section></template>
<template lwc:if={isCommunication}><section><h3>Component connections</h3><span class="badge">Mapping configuration</span><template for:each={connections} for:item="connection"><div key={connection.id} class="config-card"><label>Connection kind<input value={connection.kind} data-collection="connections" data-id={connection.id} data-field="kind" onchange={rowChange} placeholder="Parent to child / Child to parent / LMS"/></label><label>Source event<input value={connection.event} data-collection="connections" data-id={connection.id} data-field="event" onchange={rowChange}/></label><label>Payload expression<input value={connection.payload} data-collection="connections" data-id={connection.id} data-field="payload" onchange={rowChange}/></label><label>Target property / action<input value={connection.target} data-collection="connections" data-id={connection.id} data-field="target" onchange={rowChange}/></label><button data-collection="connections" data-id={connection.id} onclick={removeRow}>Remove connection</button></div></template><template lwc:if={noConnections}><p>No connections yet.</p></template><button onclick={addConnection}>＋ Add connection</button><p class="hint">Public inputs, events, methods and message channels execute after registered adapters are connected.</p></section></template>
<template lwc:if={isActions}><section><h3>Action chain</h3><span class="badge">No live execution</span><template for:each={actions} for:item="action"><div key={action.id} class="config-card"><label>Type<input value={action.type} data-collection="actions" data-id={action.id} data-field="type" onchange={rowChange} placeholder="Validate / Apex / Flow / Refresh / Branch"/></label><label>Action / method name<input value={action.name} data-collection="actions" data-id={action.id} data-field="name" onchange={rowChange}/></label><label>On error<input value={action.error} data-collection="actions" data-id={action.id} data-field="error" onchange={rowChange}/></label><div class="button-row"><button data-id={action.id} data-direction="-1" onclick={actionMove}>↑</button><button data-id={action.id} data-direction="1" onclick={actionMove}>↓</button><button data-collection="actions" data-id={action.id} onclick={removeRow}>Remove</button></div></div></template><template lwc:if={noActions}><p>No actions yet.</p></template><button onclick={addAction}>＋ Add action</button></section></template>
</template><template lwc:else><p class="hint">Select a component on the canvas or tree.</p></template></aside></div></template>
<section class="bottom"><div class="bottom-head"><strong>AI Assistant</strong><span>Diagnostics · {logs.length} events</span><span class="badge">Demo mode</span></div><div class="assistant-messages"><template for:each={aiMessages} for:item="msg"><p key={msg.id}>{msg.text}</p></template></div><div class="prompt-row"><input value={prompt} oninput={promptChange} placeholder="English / Hinglish: Discount sirf eligible customer ke liye dikhao…"/><button class="primary" onclick={ai}>Send</button></div><details><summary>Diagnostic trace</summary><template for:each={logs} for:item="log"><p key={log.id}>{log.text}</p></template></details></section>
<template lwc:if={showModal}><div class="backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-label={modal}><header><h2>{modal}</h2><button onclick={close} aria-label="Close dialog">×</button></header>
<template lwc:if={isPreview}><p class="hint">Sample preview · No live records or backend calls</p><label>Order Status<select onchange={statusChange}><option>Draft</option><option>Submitted</option></select></label><template for:each={previewNodes} for:item="node"><c-builder-node key={node.id} node={node} runtime={runtime} preview state={previewState} onpreviewchange={previewChange} onadapterevent={adapterEvent} ondemoaction={demoAction}></c-builder-node></template></template>
<template lwc:if={isNew}><p>Current design remains in Undo history. Export it before closing the browser.</p><label>Project name<input value={draftName} oninput={newName}/></label><button class="primary" onclick={create}>Create project</button></template>
<template lwc:if={isVersions}><template for:each={versions} for:item="version"><div key={version.id} class="version"><strong>{version.name}</strong><span>{version.date}</span><button data-id={version.id} onclick={restore}>Restore</button></div></template><p class="hint">Up to 10 snapshots are included in exported JSON.</p></template>
<template lwc:if={isDeploy}><p>Generation and authenticated deployment connect in Phase 4. No code has been generated or deployed.</p><p>Selected target: {project.target}</p><button onclick={download}>Download project definition</button></template>
<template lwc:if={isRow}><label>Quantity<input type="number" value="12"/></label><label>Unit Price<input type="number" value="1250"/></label><p class="hint">Popup form demonstration only. Changes are not written to records or sample rows.</p><button onclick={rowSave}>Close demo form</button></template>
<footer><button onclick={close}>Close</button></footer></section></div></template>
</div></template>
